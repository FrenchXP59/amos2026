<!doctype html>
<html lang="fr" data-theme="nuit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La box IA, AMOS</title>
  <meta name="description" content="Espace de cours par classe et par année : séances, vidéos, applis et ressources. AMOS Sport Business School.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo-amos.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="Accueil de la box">
      <img src="assets/logo-amos.png" alt="AMOS Sport Business School">
      <span class="brand-name">La box IA</span>
    </a>
    <nav class="years" id="years" aria-label="Année"></nav>
    <a class="icon-btn convention-link" id="convention-link" href="convention/">Convention 3D</a>
    <button class="icon-btn" id="teacher-btn">Espace formateur</button>
    <button class="icon-btn" id="theme-btn" aria-label="Changer de thème">Jour</button>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="teacher-dialog" class="teacher-dialog"><form id="teacher-form"><h2>Accès formateur</h2><p>Votre code personnel donne accès à toutes les classes et à leurs séances.</p><label for="teacher-code">Code formateur</label><input id="teacher-code" type="password" inputmode="numeric" maxlength="64" autocomplete="off" required><p id="teacher-error" class="err" role="alert"></p><div class="teacher-actions"><button type="button" id="teacher-cancel" class="icon-btn">Annuler</button><button type="submit" class="btn primary">Ouvrir mon espace</button></div></form></dialog>
  <script src="data/annees.js"></script>
  <script src="intro-gate.js"></script>
  <script type="module" src="box.js"></script>
</body>
</html>
